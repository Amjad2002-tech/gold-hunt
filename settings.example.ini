# ============================================================
#  EXAMPLE ONLY - your real settings live in settings.ini (PC) and the GOLD_HUNT_SETTINGS secret (GitHub).
#  GOLD HUNT - your settings. Edit the numbers, then save.
#  Lines starting with # are notes and are ignored.
# ============================================================

[gold]
# How many grams of gold you hold - change this any time
grams = 100
# What you paid per gram (SAR, 24K)
buy_price = 500
# Alert when price goes ABOVE this (SAR/gram). Leave blank = auto (suggested from 2-year analysis)
alert_above =
# Alert when price goes BELOW this (SAR/gram). Leave blank = auto
alert_below =

# ---- Stocks: one block per stock. Copy a block to add more. ----
# Saudi tickers end with .SR  (Aramco = 2222.SR, Al Rajhi = 1120.SR)

[stock:2222.SR]
name = Aramco
shares = 1
buy_price = 25
currency = SAR
alert_above =
alert_below =

[stock:NVDA]
name = NVIDIA
shares = 1
buy_price = 100
currency = USD
alert_above =
alert_below =

[alerts]
# Alert if the price moves more than this % in one day
daily_move_percent = 2
# How often to check, in minutes (used by the scheduler)
check_every_minutes = 30

# ---- WhatsApp recipients (CallMeBot). One line each: phone = apikey ----
# Phone in international format without + or spaces, e.g. 9665XXXXXXXX
[whatsapp]
# 9665XXXXXXXX = 123456
