name: Gold Hunt alerts

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC), 24/7
  workflow_dispatch:          # "Run workflow" button for a manual check
    inputs:
      test:
        description: "Only send a WhatsApp test message"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: gold-hunt

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Remember which alerts were already sent today (kept private in the Actions cache)
      - uses: actions/cache/restore@v4
        with:
          path: alerts_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Check prices and send alerts
        env:
          GOLD_HUNT_SETTINGS: ${{ secrets.GOLD_HUNT_SETTINGS }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          META_WA_TOKEN: ${{ secrets.META_WA_TOKEN }}
          META_WA_PHONE_ID: ${{ secrets.META_WA_PHONE_ID }}
          META_WA_TO: ${{ secrets.META_WA_TO }}
          TEST_ONLY: ${{ inputs.test }}
        # Output is kept quiet so holdings and P/L never appear in the public log;
        # on failure only error type names are shown (no names, numbers or prices)
        run: |
          if [ "$TEST_ONLY" = "true" ]; then
            python gold_hunt.py --test | grep -oE "HTTP [0-9]+( [0-9]+)?|FAILED \([A-Za-z]+\)"
            exit 0
          fi
          python gold_hunt.py > out.txt 2>&1 && exit 0
          grep -oE "FAILED_ASSET [A-Za-z]+|^[A-Za-z.]+(Error|Exception)" out.txt | sort | uniq -c
          exit 1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: alerts_state.json
          key: alert-state-${{ github.run_id }}
